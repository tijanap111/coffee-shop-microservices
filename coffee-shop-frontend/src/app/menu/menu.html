<app-navbar />
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Meni</h2>
    <button class="btn btn-outline-primary" (click)="goToCart()">
      Korpa ({{ cartItemCount() }})
    </button>
  </div>

  <form #filterForm="ngForm" class="row g-2 mb-4 align-items-end">
    <div class="col-md-4">
      <label class="form-label">Pretraga po nazivu</label>
      <input
        type="text"
        class="form-control"
        name="filterName"
        [(ngModel)]="filterName"
        placeholder="npr. kafa">
    </div>

    <div ngModelGroup="priceRange" #priceRange="ngModelGroup" class="col-md-6 d-flex gap-2">
      <div class="flex-fill">
        <label class="form-label">Cena od</label>
        <input
          type="number"
          class="form-control"
          name="minPrice"
          [(ngModel)]="minPrice"
          placeholder="0">
      </div>
      <div class="flex-fill">
        <label class="form-label">Cena do</label>
        <input
          type="number"
          class="form-control"
          name="maxPrice"
          [(ngModel)]="maxPrice"
          placeholder="1000">
      </div>
    </div>

    <div class="col-md-2">
      <button type="button" class="btn btn-outline-secondary w-100" (click)="resetFilters()">Resetuj</button>
    </div>
  </form>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (product of filteredProducts(); track product.id) {
      <div class="col">
        <app-product-item [product]="product" (addToCartEvent)="addToCart($event)" />
      </div>
    }
  </div>

  @if (filteredProducts().length === 0) {
    <p class="text-center mt-4">Nema proizvoda koji odgovaraju pretrazi.</p>
  }
</div>
