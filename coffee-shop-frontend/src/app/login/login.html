<div class="container mt-5" style="max-width: 400px;">
  <h2 class="mb-4">Prijava</h2>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
      @if (emailControl?.invalid && emailControl?.touched) {
        <div class="text-danger">Unesite validan email.</div>
      }
    </div>

    <div class="mb-3">
      <label class="form-label">Lozinka</label>
      <input type="password" class="form-control" formControlName="password">
      @if (passwordControl?.invalid && passwordControl?.touched) {
        <div class="text-danger">Lozinka je obavezna.</div>
      }
    </div>

    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }

    <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Prijavi se</button>
  </form>
</div>
